name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: PHP installeren
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Afhankelijkheden installeren
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Tests draaien
        run: composer test

  quality:
    runs-on: ubuntu-latest
    name: Code-stijl en statische analyse

    steps:
      - uses: actions/checkout@v4

      - name: PHP installeren
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Afhankelijkheden installeren
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Tools installeren
        run: composer tools

      - name: Code-stijl controleren
        run: composer cs

      - name: Statische analyse
        run: composer analyse
